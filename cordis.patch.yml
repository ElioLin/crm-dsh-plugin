# 场景工作台 (CRM Workspace Hub) —— DSH Bundle patch
#
# 作为 bundle 被合并进 profile 时，自动插入本插件条目。
# 场景卡片不写死在这里：它们由管理员在工作台里按 Schema 新增/编辑，
# 持久化在 <profile>/crm-workspace/state.json。
- insert:
    - id: crm-workspace
      name: '@runner-corp/dsh-scenario-workspace'
      config:
        # 留空 = 使用默认位置 <DSH_PROFILE_DIR>/crm-workspace
        dataDir: ''
        # MCP 控制平面服务基础地址。地址解析只有一条规则：
        # 优先本配置项，未配置时插件内置默认值，并自动去掉末尾斜杠。
        # 上生产时只改这里即可。
        apiBaseUrl: 'http://crmmcptest.runner-corp.com.cn:9000'
        # 身份模式：auto（默认）= 先用能自动解析到的 internal_bearer 凭据，
        # 取不到再回退 buntu（转发用户 Buntu Token）；也可强制 internal_bearer / buntu。
        authMode: auto
        # buntu 模式：用户 Token。留空时依次尝试 DSH 宿主账号上下文与环境变量。
        buntuToken: ''
        # internal_bearer 模式：部署级客户端 Token（留空读环境变量 / <DSH_HOME>/.env
        # 的 CRM_MCP_CLIENT_TOKEN）与平台用户标识（留空读 CRM_PLATFORM_USER_ID，
        # 再退到登录门禁写的 <DSH_HOME>/identity.json）。
        mcpClientToken: ''
        platformUserId: ''
        # 平台身份头名称；插件同时发送兼容别名 x-sfoa-platform-user。
        platformUserHeader: 'x-platform-user-id'
        # 场景卡片数量上限（防止界面被无意义的配置撑爆）
        maxScenarioCards: 200
        # 是否在每次模型请求前把「已激活场景 + pinnedSkills」注入会话上下文
        injectSkillsOnStep: true
        # 是否把 Skill 正文（几万字）直接写进注入块。默认 false：
        # 只注入 Skill 名称，正文由模型用 skill 工具按顺序加载。
        injectSkillBodies: false
        # 是否在技能栈里附带每个 Skill 的一行描述。默认 false（同样为了少占上下文）
        injectSkillDescriptions: false
        # 是否把每张卡片的 slashCommand 注册成真正的 Host 指令
        registerSlashCommands: true
        # 进入场景时把绑定的 Skill 以 `/技能名` 预填进输入框（1.9.0）。
        # 开：等同于用户自己引用技能，宿主会把技能正文作为 instructions 注入本次请求；
        # 关：退回 1.8.0 行为，只预填场景模板，进入前也不做技能预检。
        skillRoutePrefill: true
        # 进入场景前发现本机缺 Skill 时，按名字去「智能体中心」的技能市场自动安装。
        # 关掉只提示不自动装（装不上无论如何都会弹窗让用户决定）。
        autoInstallSkills: true
        # 是否在侧边栏显示入口（关闭后仅保留 main 面板与指令）
        showSidebarEntry: true
        # 自更新：查询新版本用的 registry。留空时按
        # 「DSH_PLUGIN_REGISTRY / npm_config_registry 环境变量 → profile 与 home 的 .npmrc → 官方源」
        # 依次推断；私有源通常只要用户机器的 .npmrc 配了 registry 与 _authToken 就无需改这里。
        updateRegistry: ''
        # 是否在打开面板时检查新版本。关掉后不再主动查，也不弹升级提示；
        # 用户仍可在「插件」页手动升级（这条开关不影响 DSH 自身的插件管理）。
        autoUpdateCheck: true
