# DSH 插件源：独立站点，跑在自己的端口上。
#
# 为什么不挂在 MCP 的 :9000 上：那个 server 块属于 MCP 服务，我们的 location 一旦
# include 进去，别人改 MCP 入口或重部署 nginx 时就会顺手冲掉，出问题也很难判断
# 是谁影响谁。独立文件、独立端口，互不牵连。
#
# 一个端口承载两件事：
#   1. /                    → Verdaccio（私有 npm 源，挂在根路径）
#   2. /plugins/index.json  → 插件市场索引（静态 JSON）
#
# registry 用根路径是刻意的：Verdaccio 6 的 url_prefix 只影响它返回的 tarball 地址、
# 不改变路由。挂在根上，tarball 地址天然正确，不需要 rewrite、也不需要 url_prefix。

server {
    listen 9001;
    server_name _;

    # 发布包走 PUT，tgz 可能几 MB。
    client_max_body_size 50m;

    # 插件市场索引：精确匹配一个文件，不开放目录列表。
    location = /plugins/index.json {
        alias /data/dsh-plugins/public/index.json;
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    # 私有 npm 源。
    location / {
        proxy_pass http://127.0.0.1:4873;

        proxy_http_version 1.1;
        # $http_host 带端口：Verdaccio 用它拼 tarball 的绝对地址，
        # 少了 :9001 客户端会去 80 端口下载，直接 404。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 发布大包、pnpm 拉 tarball 都可能慢，别让 nginx 先掐断。
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 元数据必须实时：nginx 不缓存 registry 响应。
        proxy_buffering off;
    }
}
